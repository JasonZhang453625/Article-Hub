org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Disable Kotlin incremental compilation. On this dev setup the project lives on
# D: while the pub cache is on C:, and Kotlin's incremental compiler throws
# "IllegalArgumentException: different roots" when a source file (in the C:
# pub cache) and the build dir (on D:) sit on different drive roots. Disabling
# incremental compilation sidesteps the cross-drive path bug at the cost of
# slightly slower first builds; Gradle's build cache still covers repeat runs.
kotlin.incremental=false
